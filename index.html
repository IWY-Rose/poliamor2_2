<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>poliamor2.cl</title>
    <link rel="stylesheet" href="/styles/retro.css">
</head>
<body class="splash">
    <div class="stage">
        <h1 class="brand-title">poliamor2.cl</h1>

        <div class="panel">
            <a href="index.html" class="wood-btn">jugar</a>
            <a href="index.html" class="wood-btn">about</a>
            <a href="index.html" class="wood-btn">extras</a>
            <a href="index.html" class="wood-btn">test</a>
        </div>

        <a href="merch.html" class="merch-widget">
            <img src="/images/gif0.gif" alt="Merch" class="merch-gif">
        </a>

        <!-- Bottom-left mute icon (visual) -->
        <svg class="mute-badge" viewBox="0 0 200 200" aria-hidden="true">
            <defs>
                <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#e05151"/>
                    <stop offset="100%" stop-color="#c72e2e"/>
                </linearGradient>
            </defs>
            <circle cx="100" cy="100" r="90" fill="none" stroke="url(#red)" stroke-width="20"/>
            <path d="M70 90 H45 a10 10 0 0 0 -10 10 v0 a10 10 0 0 0 10 10 H70 L100 140 V60 Z" fill="#8a8a8a"/>
            <line x1="38" y1="162" x2="162" y2="38" stroke="url(#red)" stroke-width="18" stroke-linecap="round"/>
        </svg>

        <!-- Bottom-right watermark -->
        <div class="watermark">golgi studios ©</div>

        <!-- Visitors counter (kept) -->
        <div class="visitors">
            <span class="counter-label">Visitors:</span>
            <span class="counter-number" id="visitorCount">000001337</span>
        </div>
    </div>

    <script>
        function animateCounter() {
            const counter = document.getElementById('visitorCount');
            let count = 1337;
            setInterval(() => {
                count = Math.floor(Math.random() * 9999) + 1337;
                counter.textContent = count.toString().padStart(9, '0');
            }, 5000);
        }

        document.addEventListener('DOMContentLoaded', animateCounter);
    </script>
    <script src="/js/clouds.js"></script>
</body>
</html>
