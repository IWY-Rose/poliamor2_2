<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>poliamor2.cl</title>
    <link rel="stylesheet" href="/styles/retro.css">
</head>
<body class="splash">
    <!-- SVG displacement filter for flag-wave texture -->
    <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
        <defs>
            <filter id="flag-wave" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="turbulence" baseFrequency="0.012 0.025"
                    numOctaves="3" seed="2" result="noise">
                    <animate attributeName="baseFrequency" dur="12s"
                        keyTimes="0;0.5;1"
                        values="0.012 0.025;0.018 0.035;0.012 0.025"
                        repeatCount="indefinite"/>
                </feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="noise"
                    scale="18" xChannelSelector="R" yChannelSelector="G"/>
            </filter>

            <filter id="flag-wave-mouse" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="turbulence" baseFrequency="0.02 0.04"
                    numOctaves="3" seed="7" result="noise">
                    <animate attributeName="baseFrequency" dur="12s"
                        keyTimes="0;0.5;1"
                        values="0.02 0.04;0.03 0.055;0.02 0.04"
                        repeatCount="indefinite"/>
                </feTurbulence>
                <feDisplacementMap in="SourceGraphic" in2="noise"
                    scale="85" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
        </defs>
    </svg>

    <div class="stage">
        <h1 class="brand-title">poliamor2.cl</h1>

        <div class="panel">
            <a href="index.html" class="wood-btn">jugar</a>
            <a href="index.html" class="wood-btn">about</a>
            <a href="index.html" class="wood-btn">extras</a>
            <a href="index.html" class="wood-btn">test</a>
        </div>

        <a href="merch.html" class="merch-widget">
            <img src="/images/gif0.gif" alt="Merch" class="merch-gif">
        </a>

        <!-- Bottom-left mute icon (visual) -->

    <script>
        function animateCounter() {
            const counter = document.getElementById('visitorCount');
            let count = 1337;
            setInterval(() => {
                count = Math.floor(Math.random() * 9999) + 1337;
                counter.textContent = count.toString().padStart(9, '0');
            }, 5000);
        }

        function initSlimePanel() {
            const panel = document.querySelector('.panel');
            if (!panel) return;

            const INSET = 50;
            const REST_INSET = 36;       // INSET - original 14px visual margin
            const PTS = 10;              // points per edge
            const RADIUS = 140;          // mouse influence radius (px)
            const STRENGTH = 0.18;       // how hard the mouse pulls points
            const STIFFNESS = 0.045;     // spring pull-back force
            const DAMPING = 0.88;        // velocity retained per frame (< 1 = bouncy)
            const MAX_STRETCH = 32;      // max displacement from rest (px)

            let points = [];
            let mx = null, my = null;
            let raf = null;

            function buildPoints() {
                points = [];
                const bw = panel.offsetWidth + INSET * 2;
                const bh = panel.offsetHeight + INSET * 2;
                const l = REST_INSET, t = REST_INSET;
                const r = bw - REST_INSET, b = bh - REST_INSET;

                for (let i = 0; i <= PTS; i++) {
                    const rx = l + (i / PTS) * (r - l);
                    points.push({ rx, ry: t, x: rx, y: t, vx: 0, vy: 0 });
                }
                for (let i = 1; i <= PTS; i++) {
                    const ry = t + (i / PTS) * (b - t);
                    points.push({ rx: r, ry, x: r, y: ry, vx: 0, vy: 0 });
                }
                for (let i = 1; i <= PTS; i++) {
                    const rx = r - (i / PTS) * (r - l);
                    points.push({ rx, ry: b, x: rx, y: b, vx: 0, vy: 0 });
                }
                for (let i = 1; i < PTS; i++) {
                    const ry = b - (i / PTS) * (b - t);
                    points.push({ rx: l, ry, x: l, y: ry, vx: 0, vy: 0 });
                }
            }

            function step() {
                let energy = 0;
                for (const p of points) {
                    if (mx !== null) {
                        const pmx = mx + INSET;
                        const pmy = my + INSET;
                        const dx = pmx - p.x;
                        const dy = pmy - p.y;
                        const d = Math.hypot(dx, dy);
                        if (d < RADIUS && d > 0.5) {
                            const f = ((1 - d / RADIUS) ** 2) * STRENGTH;
                            p.vx += dx * f;
                            p.vy += dy * f;
                        }
                    }
                    p.vx += (p.rx - p.x) * STIFFNESS;
                    p.vy += (p.ry - p.y) * STIFFNESS;
                    p.vx *= DAMPING;
                    p.vy *= DAMPING;

                    let nx = p.x + p.vx;
                    let ny = p.y + p.vy;
                    const ddx = nx - p.rx, ddy = ny - p.ry;
                    const dd = Math.hypot(ddx, ddy);
                    if (dd > MAX_STRETCH) {
                        const s = MAX_STRETCH / dd;
                        nx = p.rx + ddx * s;
                        ny = p.ry + ddy * s;
                        p.vx *= 0.5;
                        p.vy *= 0.5;
                    }
                    p.x = nx;
                    p.y = ny;
                    energy += p.vx * p.vx + p.vy * p.vy;
                }
                return energy;
            }

            function render() {
                const bw = panel.offsetWidth + INSET * 2;
                const bh = panel.offsetHeight + INSET * 2;
                const poly = points
                    .map(p => `${(p.x / bw * 100).toFixed(2)}% ${(p.y / bh * 100).toFixed(2)}%`)
                    .join(',');
                panel.style.setProperty('--panel-clip', `polygon(${poly})`);
            }

            function tick() {
                const energy = step();
                render();
                if (energy > 0.0001 || mx !== null) {
                    raf = requestAnimationFrame(tick);
                } else {
                    raf = null;
                }
            }

            function go() { if (!raf) raf = requestAnimationFrame(tick); }

            buildPoints();
            window.addEventListener('resize', () => { buildPoints(); go(); });

            document.addEventListener('mousemove', (e) => {
                const rect = panel.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                if (x >= 0 && x <= rect.width && y >= 0 && y <= rect.height) {
                    panel.style.setProperty('--mx', `${x}px`);
                    panel.style.setProperty('--my', `${y}px`);
                }

                const margin = RADIUS;
                if (x > -margin && x < rect.width + margin &&
                    y > -margin && y < rect.height + margin) {
                    mx = x;
                    my = y;
                    go();
                } else if (mx !== null) {
                    mx = null;
                    my = null;
                }
            });

            panel.addEventListener('mouseleave', () => {
                panel.style.setProperty('--mx', '50%');
                panel.style.setProperty('--my', '50%');
                mx = null;
                my = null;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            animateCounter();
            initSlimePanel();
        });
    </script>
</body>
</html>
