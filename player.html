<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Interactive Player ~ GOLGI STUDIOS 🎵</title>
    <link rel="stylesheet" href="/styles/retro.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
</head>
<body class="player-body">

    <div class="player-container">
        <div class="player-top-panel">
            <a href="gallery.html">
                VOLVER
            </a>
            tiutlutslusl
        </div>
        <div class="player-middle-panel">
            <div class="player-side-panel left">
                <div class="playlist-container">
                    <div class="playlist-controls">
                        <button id="playlist-up" class="playlist-btn">▲</button>
                        <button id="playlist-select" class="playlist-btn select"></button>
                        <button id="playlist-down" class="playlist-btn">▼</button>
                    </div>
                    <div class="playlist-screen">
                        <ul id="playlist" class="playlist-list"></ul>
                    </div>
                </div>
                <div class="audio-controls">
                    <button id="pause-resume-btn" class="audio-btn">⏸️</button>
                    <button id="audio-stop-btn" class="audio-btn">⏹️</button>
                </div>
            </div>
            <div class="player-screen">
                <div id="three-container"></div>
            </div>
            <div class="player-side-panel right">
                <div class="lyrics-container">
                    <div id="lyrics-display" class="lyrics-display">
                        <!-- Current lyrics will appear here -->
                    </div>
                </div>
                <div class="oscilloscope-container">
                    <canvas id="soundwave-canvas"></canvas>
                </div>
            </div>
        </div>
        <div class="player-bottom-panel">
            <div class="player-controls">
                <button id="speed-up-btn" class="player-btn">1</button>
                <button id="slow-down-btn" class="player-btn">2</button>
                <button id="stop-btn" class="player-btn">3</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/js/Player.js"></script>
    <script src="/js/clouds.js"></script>
</body>
</html>
